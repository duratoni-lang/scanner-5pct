name: Backtest v3

on:
  push:
    branches: [backtest-v3]
    paths:
      - backtest_v3.py
      - backtest_grid.py
      - backtest_pre.py
      - backtest_riesgo.py
      - arbol_decision.py
      - vix_estrategia.py
      - combo_vix.py
      - combo_ocioso.py
      - watchlist.csv
      - watchlist_mid.csv
      - .github/workflows/backtest.yml
  workflow_dispatch:
    inputs:
      inicio:
        description: "Fecha inicio (AAAA-MM-DD)"
        default: "2025-01-01"
      fin:
        description: "Fecha fin (AAAA-MM-DD)"
        default: "2025-12-31"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas openpyxl lxml scikit-learn matplotlib requests
      - name: Ejecutar backtest
        continue-on-error: true
        run: |
          python combo_ocioso.py 2>&1 | tee ocioso_log.txt
      - name: Guardar resultados en la rama
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f ocioso_log.txt ocioso_resultados.xlsx 2>/dev/null || git add -f ocioso_log.txt
          git commit -m "Resultados backtest v3 [skip ci]" || echo "sin cambios"
          git push
